<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画廊 - 悟漓的小站·一片爱的原野</title>
    <!-- ===== 字体：霞鹜文楷 ===== -->
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "LXGW WenKai Screen", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #2d3436;
            line-height: 1.8;
        }

        /* ===== 顶部导航 ===== */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 0;
            box-shadow: 0 1px 24px rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .nav-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #2d3436;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #0984e3;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #636e72;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #0984e3;
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: #0984e3;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* ===== 页面主体 ===== */
        .container {
            max-width: 820px;
            margin: 30px auto;
            padding: 44px 52px 52px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        /* ===== 页面头部 ===== */
        .page-header {
            text-align: center;
            margin-bottom: 36px;
            padding-bottom: 28px;
            border-bottom: 2px solid #f0f2f5;
        }

        .page-header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .page-header h1 .highlight {
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header .subtitle {
            color: #636e72;
            font-size: 17px;
            margin-top: 4px;
            letter-spacing: 3px;
        }

        /* ===== 分类标签（Tab 切换） ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 8px 24px;
            border: 2px solid #e9ecef;
            border-radius: 30px;
            background: transparent;
            font-size: 15px;
            font-weight: 500;
            color: #636e72;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .tab-btn:hover {
            border-color: #0984e3;
            color: #0984e3;
        }

        .tab-btn.active {
            background: #0984e3;
            color: #fff;
            border-color: #0984e3;
        }

        .tab-btn.active:hover {
            background: #0873c7;
            border-color: #0873c7;
        }

        /* ===== 画廊网格 ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .gallery-item {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: #f0f2f5;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: all 0.35s ease;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 16px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
            color: #fff;
            opacity: 0;
            transition: opacity 0.35s ease;
            transform: translateY(8px);
            transition: all 0.35s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item .overlay .title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .gallery-item .overlay .desc {
            font-size: 13px;
            opacity: 0.85;
        }

        /* ===== 空状态提示 ===== */
        .empty-hint {
            text-align: center;
            padding: 60px 20px;
            color: #b2bec3;
            grid-column: 1 / -1;
        }

        .empty-hint .big-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-hint p {
            font-size: 16px;
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 32px 24px 40px;
            color: #b2bec3;
            font-size: 14px;
            border-top: 1px solid #e9ecef;
            max-width: 820px;
            margin: 0 auto;
            letter-spacing: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .nav-container {
                flex-direction: column;
                gap: 12px;
            }
            .nav-links {
                gap: 18px;
            }
            .container {
                padding: 24px 18px 32px;
                margin: 16px 12px;
            }
            .page-header h1 {
                font-size: 24px;
            }
            .page-header .subtitle {
                font-size: 15px;
                letter-spacing: 2px;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }
            .tab-btn {
                padding: 6px 16px;
                font-size: 14px;
            }
            .tabs {
                gap: 8px;
            }
        }

        /* ===== 暗色模式 ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0d1117;
                color: #e6edf3;
            }

            .navbar {
                background: rgba(22, 27, 34, 0.9);
                border-bottom-color: rgba(255, 255, 255, 0.04);
            }

            .logo {
                color: #e6edf3;
            }

            .nav-links a {
                color: #8b949e;
            }

            .container {
                background: #161b22;
                border-color: rgba(255, 255, 255, 0.04);
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            }

            .page-header {
                border-bottom-color: #21262d;
            }

            .page-header .subtitle {
                color: #8b949e;
            }

            .tab-btn {
                border-color: #21262d;
                color: #8b949e;
            }

            .tab-btn:hover {
                border-color: #58a6ff;
                color: #58a6ff;
            }

            .tab-btn.active {
                background: #58a6ff;
                color: #0d1117;
                border-color: #58a6ff;
            }

            .gallery-item {
                background: #21262d;
                border-color: rgba(255, 255, 255, 0.04);
            }

            .gallery-item:hover {
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            }

            .footer {
                border-top-color: #21262d;
                color: #484f58;
            }
        }

        /* ===== 灯箱（点击图片放大查看） ===== */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            object-fit: contain;
        }

        .lightbox .close-btn {
            position: absolute;
            top: 24px;
            right: 32px;
            font-size: 36px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.3s ease;
            background: none;
            border: none;
            font-family: inherit;
        }

        .lightbox .close-btn:hover {
            transform: rotate(90deg);
        }

        .lightbox .caption {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 24px;
            border-radius: 30px;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <!-- ========== 导航栏 ========== -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">悟<span>漓</span></a>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/posts.html">文章列表</a></li>
                <li><a href="/resource.html">资源分享</a></li>
                <li><a href="/gallery.html" >画廊</a></li>
                <li><a href="/about.html">关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- ========== 页面内容 ========== -->
    <div class="container">

        <div class="page-header">
            <h1><span class="highlight">画廊</span></h1>
            <div class="subtitle">世间美好·皆在一瞬</div>
        </div>

        <!-- ===== 分区切换 ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-category="all">全部</button>
            <button class="tab-btn" data-category="photo">摄影</button>
            <button class="tab-btn" data-category="painting">绘画</button>
            <button class="tab-btn" data-category="calligraphy">书法</button>
        </div>

        <!-- ===== 画廊网格 ===== -->
        <div class="gallery-grid" id="galleryGrid">
            <!-- 所有作品会通过 JavaScript 动态渲染到这里 -->
        </div>

    </div>

    <!-- ========== 页脚 ========== -->
    <footer class="footer">
        悟漓的小站·一片爱的原野
    </footer>

    <!-- ===== 灯箱 ===== -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="close-btn" onclick="closeLightbox()">✕</button>
        <img id="lightboxImg" src="" alt="作品大图">
        <div class="caption" id="lightboxCaption"></div>
    </div>

    <!-- ========== JavaScript ========== -->
    <script>
        // ============================================================
        // 作品数据
        // 把你自己的作品信息填在这里，图片放到 images/gallery/ 文件夹
        // 分类：photo（摄影）、painting（绘画）、calligraphy（书法）
        // ============================================================
        var works = [
            // ---- 摄影作品 ----
            {
                id: 1,
                category: 'photo',
                title: '黄龙雪山',
                desc: '四川黄龙 · 高原雪山',
                filename: 'huanglongwanglongping.jpg'
            },
            {
                id: 2,
                category: 'photo',
                title: '五彩池',
                desc: '四川黄龙 · 五彩池',
                filename: 'wucaichi.jpg'
            },
            {
                id: 3,
                category: 'photo',
                title: '林间小溪',
                desc: '四川黄龙 · 林间小溪',
                filename: 'huanglongxiaoxi.jpg'
            },  
            {
                id: 4,
                category: 'photo',
                title: '花与山',
                desc: '四川黄龙 · 花与山',
                filename: 'huayushan.jpg'
            }
        ];

        // 当前选中的分类
        var currentCategory = 'all';

        // 获取作品图片路径
        function getImagePath(filename) {
            return '/images/gallery/' + filename;
        }

        // 渲染作品卡片
        function renderWorks(category) {
            var grid = document.getElementById('galleryGrid');
            var filtered = category === 'all' ? works : works.filter(function(w) {
                return w.category === category;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-hint">
                        <span class="big-icon">🖼️</span>
                        <p>暂无作品，敬请期待~</p>
                    </div>
                `;
                return;
            }

            var html = '';
            filtered.forEach(function(work) {
                html += `
                    <div class="gallery-item" onclick="openLightbox('${getImagePath(work.filename)}', '${work.title} - ${work.desc}')">
                        <img src="${getImagePath(work.filename)}" alt="${work.title}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23f0f2f5%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2224%22 fill=%22%23b2bec3%22%3E🖼️%3C/text%3E%3C/svg%3E'">
                        <div class="overlay">
                            <div class="title">${work.title}</div>
                            <div class="desc">${work.desc}</div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // ===== Tab 切换 =====
        var tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                tabBtns.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderWorks(currentCategory);
            });
        });

        // ===== 灯箱功能 =====
        function openLightbox(src, caption) {
            var lightbox = document.getElementById('lightbox');
            var img = document.getElementById('lightboxImg');
            var cap = document.getElementById('lightboxCaption');
            img.src = src;
            cap.textContent = caption || '';
            lightbox.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event && event.target !== event.currentTarget) return;
            var lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('show');
            document.body.style.overflow = '';
            var img = document.getElementById('lightboxImg');
            img.src = '';
        }

        // ESC 键关闭灯箱
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        // ===== 初始化 =====
        renderWorks('all');
    </script>

</body>
</html>
