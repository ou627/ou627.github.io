<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章列表 - 玄心的博客</title>
    <!-- ===== 字体：霞鹜文楷 ===== -->
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css" rel="stylesheet">
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "LXGW WenKai Screen", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #2d3436;
            line-height: 1.8;
        }

        /* ===== 顶部导航 ===== */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 0;
            box-shadow: 0 1px 24px rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .nav-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #2d3436;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #0984e3;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #636e72;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #0984e3;
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: #0984e3;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* ===== 页面主体 ===== */
        .container {
            max-width: 820px;
            margin: 30px auto;
            padding: 36px 52px 48px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        /* ===== 页面头部 ===== */
        .page-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f2f5;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .page-header h1 .highlight {
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header .count {
            color: #b2bec3;
            font-size: 14px;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* ===== 搜索框 ===== */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box input {
            flex: 1;
            padding: 10px 18px;
            border: 2px solid #e9ecef;
            border-radius: 30px;
            font-size: 15px;
            font-family: inherit;
            background: #f8f9fa;
            color: #2d3436;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0984e3;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(9, 132, 227, 0.08);
        }

        .search-box input::placeholder {
            color: #b2bec3;
        }

        .search-box .clear-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 30px;
            background: #e9ecef;
            color: #636e72;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: none;
        }

        .search-box .clear-btn.show {
            display: block;
        }

        .search-box .clear-btn:hover {
            background: #dde0e3;
        }

        /* ===== 搜索结果提示 ===== */
        .search-result {
            text-align: center;
            font-size: 14px;
            color: #b2bec3;
            margin-bottom: 16px;
            min-height: 24px;
        }

        .search-result .highlight-keyword {
            color: #0984e3;
            font-weight: 600;
        }

        /* ===== 文章列表（紧密排列） ===== */
        .post-list {
            list-style: none;
            padding: 0;
        }

        .post-list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 0;
            border-bottom: 1px solid #f0f2f5;
            transition: all 0.2s ease;
        }

        .post-list li:last-child {
            border-bottom: none;
        }

        .post-list li:hover {
            padding-left: 8px;
        }

        .post-list li a {
            color: #2d3436;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.25s;
            flex: 1;
        }

        .post-list li a:hover {
            color: #0984e3;
        }

        .post-list li .post-date {
            color: #b2bec3;
            font-size: 14px;
            flex-shrink: 0;
            margin-left: 20px;
        }

        /* ===== 无结果提示 ===== */
        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: #b2bec3;
        }

        .no-result .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .no-result p {
            font-size: 16px;
        }

        .no-result .suggestion {
            font-size: 14px;
            margin-top: 4px;
            color: #d0d3d6;
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 32px 24px 40px;
            color: #b2bec3;
            font-size: 14px;
            border-top: 1px solid #e9ecef;
            max-width: 820px;
            margin: 0 auto;
            letter-spacing: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .nav-container {
                flex-direction: column;
                gap: 12px;
            }
            .nav-links {
                gap: 16px;
            }
            .container {
                padding: 24px 18px 32px;
                margin: 16px 12px;
            }
            .page-header h1 {
                font-size: 22px;
            }
            .post-list li {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                padding: 10px 0;
            }
            .post-list li .post-date {
                margin-left: 0;
                font-size: 13px;
            }
            .post-list li a {
                font-size: 15px;
            }
            .search-box {
                max-width: 100%;
            }
            .search-box input {
                font-size: 14px;
                padding: 8px 14px;
            }
        }

        /* ===== 暗色模式 ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0d1117;
                color: #e6edf3;
            }

            .navbar {
                background: rgba(22, 27, 34, 0.9);
                border-bottom-color: rgba(255, 255, 255, 0.04);
            }

            .logo {
                color: #e6edf3;
            }

            .nav-links a {
                color: #8b949e;
            }

            .container {
                background: #161b22;
                border-color: rgba(255, 255, 255, 0.04);
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            }

            .page-header {
                border-bottom-color: #21262d;
            }

            .page-header .count {
                color: #484f58;
            }

            .search-box input {
                background: #21262d;
                border-color: #30363d;
                color: #e6edf3;
            }

            .search-box input:focus {
                border-color: #58a6ff;
                background: #161b22;
                box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.08);
            }

            .search-box input::placeholder {
                color: #484f58;
            }

            .search-box .clear-btn {
                background: #21262d;
                color: #8b949e;
            }

            .search-box .clear-btn:hover {
                background: #30363d;
            }

            .post-list li {
                border-bottom-color: #21262d;
            }

            .post-list li a {
                color: #e6edf3;
            }

            .post-list li a:hover {
                color: #58a6ff;
            }

            .post-list li .post-date {
                color: #484f58;
            }

            .search-result {
                color: #484f58;
            }

            .search-result .highlight-keyword {
                color: #58a6ff;
            }

            .no-result {
                color: #484f58;
            }

            .no-result .suggestion {
                color: #30363d;
            }

            .footer {
                border-top-color: #21262d;
                color: #484f58;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 导航栏 ========== -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">玄<span>心</span></a>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/resource.html">资源分享</a></li>
                <li><a href="/gallery.html">画廊</a></li>
                <li><a href="/posts.html" style="color:#0984e3;">文章列表</a></li>
                <li><a href="/about.html">关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- ========== 文章列表 ========== -->
    <div class="container">

        <div class="page-header">
            <h1>📄 <span class="highlight">文章列表</span></h1>
            <div class="count" id="postCount">共 0 篇文章</div>
        </div>

        <!-- ===== 搜索框 ===== -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索文章标题..." oninput="searchPosts()">
            <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕ 清除</button>
        </div>

        <!-- ===== 搜索结果提示 ===== -->
        <div class="search-result" id="searchResult"></div>

        <!-- ===== 文章列表 ===== -->
        <ul class="post-list" id="postList">
            <!-- 文章由 JavaScript 动态生成 -->
        </ul>

    </div>

    <!-- ========== 页脚 ========== -->
    <footer class="footer">
        玄之又玄 · 眾妙之門
    </footer>

    <!-- ========== JavaScript ========== -->
    <script>
        // ============================================================
        // 文章数据
        // ============================================================
        var posts = [
            {
                title: '我的第一篇博客',
                link: '/posts/2026-08-12-第一篇博客.html',
                date: '2026年8月12日'
            },
            {
                title: 'GitHub Pages 搭建指南',
                link: '/posts/2026-08-10-第二篇博客.html',
                date: '2026年8月10日'
            },
            {
                title: '前端学习路线分享',
                link: '/posts/2026-08-08-第三篇博客.html',
                date: '2026年8月8日'
            }
            // 新增文章时，按以下格式添加：
            // {
            //     title: '文章标题',
            //     link: '/posts/2026-08-15-文章链接.html',
            //     date: '2026年8月15日'
            // }
        ];

        // ===== 获取 DOM 元素 =====
        var list = document.getElementById('postList');
        var countEl = document.getElementById('postCount');
        var searchInput = document.getElementById('searchInput');
        var clearBtn = document.getElementById('clearBtn');
        var searchResult = document.getElementById('searchResult');

        // ===== 渲染文章列表 =====
        function renderPosts(filteredPosts, keyword) {
            var displayPosts = filteredPosts || posts;

            if (displayPosts.length === 0) {
                list.innerHTML = `
                    <div class="no-result">
                        <span class="icon">🔍</span>
                        <p>没有找到匹配的文章</p>
                        <p class="suggestion">试试其他关键词吧</p>
                    </div>
                `;
                countEl.textContent = '共 0 篇文章';
                return;
            }

            // 按日期从新到旧排序
            var sorted = displayPosts.slice().sort(function(a, b) {
                return b.date.localeCompare(a.date);
            });

            var html = '';
            sorted.forEach(function(post) {
                // 高亮匹配的关键词
                var displayTitle = post.title;
                if (keyword && keyword.trim()) {
                    var regex = new RegExp(keyword.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                    displayTitle = post.title.replace(regex, function(match) {
                        return '<span style="color:#0984e3;font-weight:700;">' + match + '</span>';
                    });
                }
                html += `
                    <li>
                        <a href="${post.link}">${displayTitle}</a>
                        <span class="post-date">${post.date}</span>
                    </li>
                `;
            });

            list.innerHTML = html;
            countEl.textContent = '共 ' + sorted.length + ' 篇文章';
        }

        // ===== 搜索功能 =====
        function searchPosts() {
            var keyword = searchInput.value;
            var trimmed = keyword.trim();

            // 显示/隐藏清除按钮
            if (trimmed) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }

            if (!trimmed) {
                // 无关键词，显示全部
                searchResult.innerHTML = '';
                renderPosts(posts);
                return;
            }

            // 过滤文章（标题包含关键词，不区分大小写）
            var filtered = posts.filter(function(post) {
                return post.title.toLowerCase().includes(trimmed.toLowerCase());
            });

            // 显示搜索结果提示
            if (filtered.length > 0) {
                searchResult.innerHTML = '找到 <span class="highlight-keyword">' + filtered.length + '</span> 篇包含“<span class="highlight-keyword">' + trimmed + '</span>”的文章';
            } else {
                searchResult.innerHTML = '未找到包含“<span class="highlight-keyword">' + trimmed + '</span>”的文章';
            }

            renderPosts(filtered, trimmed);
        }

        // ===== 清除搜索 =====
        function clearSearch() {
            searchInput.value = '';
            clearBtn.classList.remove('show');
            searchResult.innerHTML = '';
            renderPosts(posts);
            searchInput.focus();
        }

        // ===== 键盘支持：ESC 清除搜索 =====
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                clearSearch();
            }
        });

        // ===== 初始化 =====
        renderPosts(posts);
    </script>

</body>
</html>
